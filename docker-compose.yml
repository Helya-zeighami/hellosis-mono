services:
  postgres:
    image: postgres:18
    container_name: hellosis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hellosis
      POSTGRES_PASSWORD: hellosis
      POSTGRES_DB: hellosis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: